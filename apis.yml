aid: atob
name: AtoB
description: >-
  AtoB is a fleet payments platform for the trucking and transportation
  industry, offering fuel cards, spend-management controls, driver payouts,
  and trip credit to fleets of every size. Its cards work across a nationwide
  fuel network with truck-stop discounts, granular purchase controls
  (fuel-only, category/MCC restrictions, per-transaction and daily limits),
  telematics-aware fraud prevention, and reporting that supports IFTA fuel-tax
  and expense compliance. AtoB also runs partner programs for factoring
  companies, freight brokers, and merchants, and exposes a private Partners API
  used by telematics and fleet-management integrations (for example Fleetio and
  Oxmaint) to sync cards, drivers, vehicles, and settled fuel transactions.
  AtoB was surfaced as a portfolio company of Bloomberg Beta and General
  Catalyst; this profile has been enriched from public web sources.
